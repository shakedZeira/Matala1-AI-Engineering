version: 2

models:
  - name: stg_reviews
    description: "One valid review per row after rating, text and duplicate rules"
    columns:
      - name: review_id
        data_tests: [unique, not_null]
      - name: rating
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: mart_product_reviews
    description: "One row per product: review stats and paid-order revenue, aggregated separately before joining"
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: review_count
        data_tests: [not_null]
      - name: revenue
        data_tests: [not_null]
